<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sweatband</title>

<!-- iOS home screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweatband">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#150a2e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1: #150a2e;
    --bg2: #2b1054;
    --card: #251642;
    --card-line: #4a2f7a;
    --pink: #ff3d9a;
    --cyan: #34e6ff;
    --violet: #a259ff;
    --yellow: #ffcf4d;
    --ink: #fdf3ff;
    --ink-dim: #b9a4d9;
    --radius: 16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Poppins', -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, #431a5e 100%);
    min-height: 100vh;
    padding: max(18px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom)) 14px;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, transparent 1px, transparent 3px),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, #431a5e 100%);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  h1,h2,.disp{ font-family:'Audiowide', sans-serif; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 20px; padding: 0 2px;
  }
  .brand{
    font-family:'Audiowide', sans-serif; font-size: 19px; letter-spacing:1px;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    -webkit-background-clip: text; background-clip:text; color: transparent;
  }
  .band{
    width:22px; height:10px; border-radius:6px;
    background: linear-gradient(90deg, var(--yellow), var(--pink));
    display:inline-block; margin-right:8px; vertical-align:middle;
    box-shadow: 0 0 10px rgba(255,207,77,0.7);
  }
  .rounds{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .round-label{ font-family:'Audiowide', sans-serif; font-size: 11px; color: var(--ink-dim); letter-spacing: 0.5px; }
  .rdots{ display:flex; gap:6px; }
  .rmark{ width:10px; height:10px; border-radius:3px; background: #3a2a5c; transform: rotate(45deg); }
  .rmark.done{ background: var(--violet); box-shadow:0 0 6px rgba(162,89,255,0.7); }
  .rmark.on{ background: var(--pink); box-shadow:0 0 10px rgba(255,61,154,0.9); width:13px; height:13px; }

  .ticket{
    background: linear-gradient(150deg, var(--card), #1c1136);
    border: 1px solid var(--card-line);
    border-radius: var(--radius);
    padding: 22px 20px 24px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 12px 30px rgba(0,0,0,0.4);
  }
  .ticket::before{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:70px;
    background: repeating-linear-gradient(90deg, rgba(52,230,255,0.12) 0 2px, transparent 2px 22px);
    mask: linear-gradient(to top, black, transparent);
    opacity: 0.6;
  }
  .ribbon{
    display:inline-block; font-family:'Audiowide', sans-serif; font-size: 11px;
    color: #1c1136; background: linear-gradient(90deg, var(--yellow), var(--pink));
    padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 12px;
  }
  .week-tag{ font-size: 12px; color: var(--ink-dim); letter-spacing: 1px; margin-bottom: 6px; }
  .round-title{
    font-family:'Audiowide', sans-serif; font-size: 26px; line-height:1.15; margin: 0 0 10px;
    color: var(--ink);
    text-shadow: 0 0 12px rgba(255,61,154,0.55), 0 0 26px rgba(52,230,255,0.28);
    position: relative; z-index:1;
  }
  .round-hint{ font-size: 13px; color: var(--ink-dim); position:relative; z-index:1; }

  .section-label{
    display:flex; align-items:center; gap:10px;
    margin: 24px 4px 10px;
    font-family:'Audiowide', sans-serif;
    font-size: 12px; letter-spacing: 1.5px; color: var(--cyan);
  }
  .section-label .laser{
    flex:1; height:3px; border-radius:2px;
    background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan));
    opacity:0.55;
  }

  .row{
    position:relative;
    display:flex; align-items:flex-start; gap:12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-line);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 8px;
    overflow:hidden;
  }
  .row.checked{ border-color: var(--violet); background: rgba(162,89,255,0.10); }
  .check{
    flex-shrink:0; width:23px; height:23px; margin-top:1px;
    border: 2px solid var(--ink-dim); border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    color: #1c1136; font-size: 13px; font-weight:700;
  }
  .row.checked .check{ background: linear-gradient(135deg, var(--pink), var(--violet)); border-color: transparent; }
  .row-text{ flex:1; }
  .row-name{ font-size: 15px; font-weight:600; color: var(--ink); }
  .row.checked .row-name{ color: var(--ink-dim); }
  .row-meta{ font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; line-height:1.4; }
  .form-link{ display:inline-block; font-size: 12px; color: var(--cyan); margin-top: 4px; text-decoration: underline; }
  .weight-box{ display:flex; align-items:center; gap:6px; margin-top: 6px; }
  .weight-input{
    width: 54px; background: rgba(255,255,255,0.06); border: 1px solid var(--card-line);
    border-radius: 8px; color: var(--ink); font-family:'Audiowide', sans-serif; font-size: 13px;
    padding: 5px 6px; text-align:center;
  }
  .weight-input:focus{ outline: none; border-color: var(--cyan); }
  .weight-unit{ font-size: 11px; color: var(--ink-dim); }
  .row-sets{ font-family:'Audiowide', sans-serif; font-size: 14px; color: var(--cyan); flex-shrink:0; text-align:right; min-width: 50px; padding-top:2px; }
  .stamp{
    position:absolute; right:-4px; top:8px;
    font-family:'Audiowide', sans-serif; font-size: 11px;
    color: var(--yellow); border: 1.5px solid var(--yellow);
    padding: 2px 10px; border-radius: 20px 0 0 20px;
    transform: rotate(-6deg);
    text-shadow: 0 0 6px rgba(255,207,77,0.7);
    box-shadow: 0 0 8px rgba(255,207,77,0.3);
  }

  .cta{
    width:100%; border: none; border-radius: 30px;
    background: linear-gradient(90deg, var(--pink), var(--violet));
    color: #fff;
    font-family:'Audiowide', sans-serif; font-size: 16px; letter-spacing: 0.5px;
    padding: 17px; margin-top: 22px;
    box-shadow: 0 0 24px rgba(255,61,154,0.45), 0 6px 18px rgba(0,0,0,0.35);
  }
  .cta:active{ transform: scale(0.98); }

  .link-btn{
    display:block; width:100%; text-align:center; background:none; border:none;
    color: var(--ink-dim); font-size: 13px; padding: 13px;
    font-family:'Poppins', sans-serif;
  }
  .link-btn u{ text-decoration-color: var(--cyan); }

  .record-card{
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-line);
    border-radius: 12px; padding: 4px 14px; margin-top: 6px;
  }
  .hist-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 11px 0; border-bottom: 1px dashed rgba(255,255,255,0.08);
    font-size: 13px;
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-day{ color: var(--ink); font-weight:500; }
  .hist-date{ color: var(--ink-dim); }
  .empty{ color: var(--ink-dim); font-size: 13px; padding: 10px 0; }

  .picker-overlay{
    position: fixed; inset:0; background: rgba(10,4,20,0.8);
    display:flex; align-items:flex-end; z-index: 200;
  }
  .picker-sheet{
    background: linear-gradient(160deg, var(--card), #1c1136); width:100%;
    border-radius: 20px 20px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom));
    max-height: 70vh; overflow-y:auto; border-top: 1px solid var(--card-line);
  }
  .picker-title{
    font-family:'Audiowide', sans-serif; font-size:17px; color: var(--ink);
    margin: 2px 0 14px;
  }
  .picker-item{
    padding: 13px 14px; border-radius: 12px; margin-bottom: 7px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--card-line);
    font-size: 14px; color: var(--ink); font-weight:500;
  }
  .picker-item .pi-sub{ color: var(--ink-dim); font-size: 12px; margin-top:2px; font-weight:400; }
  .picker-cancel{ margin-top: 8px; }

  .toast{
    position: fixed; left:14px; right:14px; bottom: max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(90deg, var(--violet), var(--pink)); color: #fff;
    padding: 14px 16px; border-radius: 14px;
    font-size: 13px; font-weight:500; text-align:center; z-index: 20;
    box-shadow: 0 0 24px rgba(255,61,154,0.5);
    animation: rise 0.2s ease-out;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform: translateY(0);} }

    display: flex; flex-direction: column; align-items: center; justify-content: center;

  #splash::before{
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(64% 26% at 50% 50%, rgba(13,3,32,.6) 0%, rgba(13,3,32,.32) 60%, rgba(13,3,32,0) 100%);

    content: "";

    filter: drop-shadow(0 0 18px rgba(255,45,149,.55));
    margin: 0;

  .splash-tag{
    margin-top: 14px; font-size: 17px; color: #e6dcf7;
    text-shadow: 0 2px 12px rgba(13,3,32,.9);

    margin-top: 24px;
    display: flex; align-items: center; justify-content: center;
    width: 100%; max-width: 300px; height: 62px;
    border: 0; border-radius: 31px;
    background: linear-gradient(90deg, #ff2b8f 0%, #c356f0 58%, #8f6bf5 100%);
    box-shadow: 0 0 44px rgba(255,45,149,.5), 0 10px 28px rgba(13,3,32,.7);
    color: #fff; font-family:'Audiowide', sans-serif; font-size: 18px; font-weight: 600;
    cursor: pointer; transition: filter .15s ease, transform .15s ease;

    margin-top: 12px; font-size: 15px; font-weight: 500;
    background: none; border: none; color: #4ad9f0;

  .about-title{
    font-family:'Audiowide', sans-serif; font-size: 19px; color: var(--pink);
    margin: 2px 0 14px; text-shadow: 0 0 10px rgba(255,61,154,0.5);
  }
  .about-body{ font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 20px; }

    width:100%; border: none; border-radius: 30px;
    background: linear-gradient(90deg, var(--pink), var(--violet));
    color: #fff; font-family:'Audiowide', sans-serif; font-size: 15px;
    padding: 14px; box-shadow: 0 0 20px rgba(255,61,154,0.4);

<body>

<div id="splash">
  <div class="splash-content">
    <div class="splash-logo">
      <span class="splash-pill" aria-hidden="true"></span>
      <h1 class="splash-brand">SWEATBAND</h1>
    </div>
    <p class="splash-tag">Time to get on it</p>
    <button class="splash-cta" onclick="document.getElementById('splash').classList.add('hide')">Let's Workout →</button>
    <button class="splash-about" onclick="openAbout()">What's Sweatband?</button>
  </div>
</div>

<div class="topbar">
  <div class="brand" onclick="document.getElementById('splash').classList.remove('hide')" style="cursor:pointer;"><span class="band"></span>SWEATBAND</div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button onclick="openAbout()" style="background:none;border:1px solid var(--card-line, #4a2f7a);color:var(--cyan);width:24px;height:24px;border-radius:50%;font-family:'Audiowide',sans-serif;font-size:12px;">?</button>
    <div class="rounds" id="rounds"></div>
  </div>
</div>

<div id="app"></div>

<div id="picker-root"></div>

<script>
const WARMUP_A = [
  { name: "Cross trainer", meta: "15 min, alternating 1 min arms-assisted / 1 min legs-only, HR ~135", link: "https://www.puregym.com/blog/elliptical-machine-hiit/" },
  { name: "Rotational lunges", meta: "10 each leg (20 total), rotate top half of body fully round", link: "https://www.fitmetrics.ch/en/exercise/6733d70d6deca-lunge-with-thoracic-rotation" },
  { name: "Lunge chest opener", meta: "Thumb-tracking rotation, both sides", link: "https://www.neuroendomke.com/exercise-of-the-week-deep-lunge-stretch-with-thoracic-rotational-reach/" },
  { name: "Cat-cow", meta: "10 reps", link: "https://health.clevelandclinic.org/cat-cow-stretch" },
  { name: "Pigeon pose", meta: "Hold, both sides", link: "https://www.healthline.com/health/fitness/pigeon-pose" },
  { name: "Press-ups", meta: "10 reps", link: "https://www.acefitness.org/resources/everyone/exercise-library/41/push-up/" },

const WARMUP_B = [
  { name: "Bike or cross trainer", meta: "8 min easy-to-moderate, HR toward 130–135", link: "https://www.puregym.com/blog/elliptical-machine-hiit/" },
  { name: "Rotational lunge + thoracic opener", meta: "10 each side", link: "https://www.fitmetrics.ch/en/exercise/6733d70d6deca-lunge-with-thoracic-rotation" },
  { name: "Cat-cow + hip flexor stretch", meta: "1 min", link: "https://health.clevelandclinic.org/cat-cow-stretch" },

const ROUTINE = [
  {
    round: "Round 1", title: "Arms & Chest", week: 1, warmup: WARMUP_A,
    exercises: [

    round: "Round 2", title: "Legs", week: 1, warmup: WARMUP_A,

    exercises: [

    ]
  },
  {

    exercises: [
      { name: "Chest press machine", meta: "Progress load once clean", sets: "4×10", link: "https://www.acefitness.org/resources/everyone/exercise-library/188/seated-chest-press/", trackWeight: true },
      { name: "Seated row machine", meta: "", sets: "4×10", link: "https://www.acefitness.org/resources/everyone/exercise-library/48/seated-row/", trackWeight: true },
      { name: "Shoulder press machine", meta: "", sets: "3×10", link: "https://www.acefitness.org/resources/everyone/exercise-library/186/seated-shoulder-press/", trackWeight: true },
      { name: "Single-arm DB row", meta: "Bench-supported · Target: up to 20kg", sets: "3×10", link: "https://www.puregym.com/exercises/back/rows/single-arm-dumbbell-row/", trackWeight: true },
      { name: "Pallof press", meta: "Band/cable, or dumbbell resisting rotation", sets: "3×10", link: "https://www.puregym.com/exercises/abs/pallof-press/", trackWeight: true },
    ]
  },
  {
    round: "Round 5", title: "Legs (Varied)", week: 2, warmup: WARMUP_B,
    exercises: [
      { name: "Leg press machine", meta: "Progress load once clean", sets: "4×10", link: "https://exrx.net/WeightExercises/GluteusMaximus/LVSeatedLegPress", trackWeight: true },
      { name: "Leg curl machine", meta: "Hamstrings", sets: "3×10", link: "https://exrx.net/WeightExercises/Hamstrings/LVSeatedLegCurl", trackWeight: true },
      { name: "Bulgarian split squat", meta: "Rear foot on bench · Target: 10–14kg", sets: "3×8", link: "https://www.nasm.org/resource-center/exercise-library/bulgarian-split-squat", trackWeight: true },
      { name: "Romanian deadlifts", meta: "Target: 20kg per dumbbell (x2)", sets: "3×10", link: "https://www.nasm.org/resource-center/exercise-library/dumbbell-romanian-deadlift", trackWeight: true },
      { name: "Standing calf raise", meta: "Machine or dumbbells", sets: "3×12", link: "https://www.acefitness.org/resources/everyone/exercise-library/73/standing-calf-raises-wall/", trackWeight: true },

  {
    round: "Round 6", title: "Cardio, Core & Conditioning", week: 2, warmup: WARMUP_B,
    exercises: [
      { name: "Running machine intervals", meta: "1 min hard / 1 min easy × 8 (16 min)", sets: "—", link: "https://www.garagegymreviews.com/treadmill-interval-training-workouts" },
      { name: "Kettlebell swings", meta: "Target: 17.5–20kg", sets: "4×10", link: "https://www.acefitness.org/resources/everyone/exercise-library/391/swing/", trackWeight: true },
      { name: "Single-arm KB snatch", meta: "Alternating · Target: 17.5–20kg", sets: "4×10", link: "https://workoutlabs.com/exercise-guide/one-arm-kettlebell-snatch/", trackWeight: true },
      { name: "Stability ball plank/rollout", meta: "Build duration over time", sets: "3×30–45s", link: "https://fitbod.me/exercises/stability-ball-roll-out" },
      { name: "Russian twist", meta: "Dumbbell or kettlebell", sets: "3×10", link: "https://spotebi.com/exercise-guide/russian-twist/", trackWeight: true },
    ]

const STORAGE_KEY = "gym-tracker-state";
let state = { currentIndex: 0, checked: {}, log: [], weights: {}, weightInputs: {} };
let stateLoaded = false;

function exId(dayIdx, section, i){ return dayIdx + "-" + section + "-" + i; }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const loaded = JSON.parse(raw);
      state = Object.assign({ currentIndex: 0, checked: {}, log: [], weights: {}, weightInputs: {} }, loaded);
    }
  }catch(e){ /* no saved state yet */ }
  stateLoaded = true;
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    console.error("Save failed", e);
    return false;
  }
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
}

function toggleCheck(id){
  if(state.checked[id]) delete state.checked[id];
  else state.checked[id] = true;
  saveState();
  render();
}

function renderRounds(){
  const el = document.getElementById('rounds');
  el.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'round-label';
  label.textContent = 'Round ' + (state.currentIndex + 1) + ' of 6';
  el.appendChild(label);
  const dots = document.createElement('div');
  dots.className = 'rdots';
  for(let i=0;i<6;i++){
    const m = document.createElement('div');
    let cls = 'rmark';
    if(i === state.currentIndex) cls += ' on';
    else if(i < state.currentIndex) cls += ' done';
    m.className = cls;
    dots.appendChild(m);
  }
  el.appendChild(dots);
}

function lastWeight(name){
  const hist = state.weights[name];
  if(hist && hist.length){ return hist[hist.length-1].kg; }
  return null;
}

function updateWeightInput(name, value){
  state.weightInputs[name] = value;
  saveState();
}

function renderRow(item, id, withCheck){
  const checked = !!state.checked[id];
  const last = item.trackWeight ? lastWeight(item.name) : null;
  const current = item.trackWeight ? (state.weightInputs[item.name] ?? (last ?? '')) : null;
  return `
    <div class="row ${checked?'checked':''}" ${withCheck ? `onclick="toggleCheck('${id}')"` : ''}>
      ${checked ? `<div class="stamp">Rad!</div>` : ''}
      ${withCheck ? `<div class="check">${checked?'✓':''}</div>` : ''}
      <div class="row-text">
        <div class="row-name">${item.name}</div>
        ${item.meta ? `<div class="row-meta">${item.meta}</div>` : ''}
        ${item.link ? `<a class="form-link" href="${item.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Form guide ↗</a>` : ''}
        ${item.trackWeight ? `
          <div class="weight-box" onclick="event.stopPropagation()">
            <input type="number" inputmode="decimal" step="0.5" class="weight-input"
              value="${current}" placeholder="${last !== null ? last : 'kg'}"
              onchange="updateWeightInput('${item.name.replace(/'/g,"\\'")}', this.value)" />
            <span class="weight-unit">kg${last !== null ? ' · last ' + last + 'kg' : ''}</span>
          </div>` : ''}
      </div>
      <div class="row-sets">${item.sets || ''}</div>
    </div>`;
}

function render(){
  if(!stateLoaded) return;
  renderRounds();
  const dayIdx = state.currentIndex;
  const d = ROUTINE[dayIdx];

  let warmupHtml = d.warmup.map((w,i)=> renderRow(w, exId(dayIdx,'w',i), true)).join('');
  let mainHtml = d.exercises.map((e,i)=> renderRow(e, exId(dayIdx,'m',i), true)).join('');

  let historyHtml = '';
  if(state.log.length === 0){
    historyHtml = `<div class="empty">No seshes logged yet. Lace up the leg warmers.</div>`;
  } else {
    historyHtml = `<div class="record-card">` + state.log.slice(-6).reverse().map(l => `
      <div class="hist-row">
        <span class="hist-day">${l.dayTitle}</span>
        <span class="hist-date">${fmtDate(l.timestamp)}</span>
      </div>`).join('') + `</div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="ticket">
      <div class="ribbon">Up next</div>
      <div class="week-tag">Week ${d.week} · ${d.round}</div>
      <div class="round-title">${d.title}</div>
      <div class="round-hint">Tap each move off as you crush it.</div>
    </div>

    <div class="section-label"><span>Warm-up</span><span class="laser"></span></div>
    ${warmupHtml}

    <div class="section-label"><span>Main work</span><span class="laser"></span></div>
    ${mainHtml}

    <button class="cta" onclick="completeSession()">Log this sesh</button>
    <button class="link-btn" onclick="openPicker()"><u>Nah, gimme a different day</u></button>

    <div class="section-label" style="margin-top:28px;"><span>Sesh history</span><span class="laser"></span></div>
    ${historyHtml}
    ${state.log.length ? `<button class="link-btn" onclick="undoLast()"><u>Undo last sesh</u></button>` : ''}
  `;
}

function completeSession(){
  const d = ROUTINE[state.currentIndex];
  const today = new Date().toISOString();

  d.exercises.forEach(item => {
    if(item.trackWeight){
      const val = parseFloat(state.weightInputs[item.name]);
      if(!isNaN(val)){
        if(!state.weights[item.name]) state.weights[item.name] = [];
        state.weights[item.name].push({ date: today, kg: val });
        if(state.weights[item.name].length > 12) state.weights[item.name].shift();
      }
    }
  });

  state.log.push({
    dayTitle: d.round + " · " + d.title,
    timestamp: today,
    index: state.currentIndex
  });
  state.checked = {};
  state.currentIndex = (state.currentIndex + 1) % 6;
  saveState();
  render();
  const next = ROUTINE[state.currentIndex];
  showToast("Logged! Next up: " + next.round + " — " + next.title);
}

function undoLast(){
  if(state.log.length === 0) return;
  const last = state.log.pop();
  state.currentIndex = last.index;
  state.checked = {};
  saveState();
  render();
  showToast("Rewound to " + ROUTINE[state.currentIndex].round);
}

function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2600);
}

function openAbout(){
  const root = document.getElementById('picker-root');
  root.innerHTML = `
    <div class="picker-overlay" onclick="if(event.target===this) closeAbout()">
      <div class="picker-sheet about-sheet">
        <div class="about-title">What Even Is Sweatband?!</div>
        <div class="about-body">
          Sweatband is a totally rad training app, built for anyone who came of age on mixtapes, leg warmers, and way too much hairspray. Six killer routines cycle through so your muscles never get bored — and neither does your spandex. Tap through your reps, log your sesh, and keep those neon headbands looking sharp. No excuses, just gains — because looking this good in Lycra takes serious work.
        </div>
        <button class="about-close" onclick="closeAbout()">Rad. Let's go.</button>
      </div>
    </div>
  `;
}
function closeAbout(){ document.getElementById('picker-root').innerHTML = ''; }

function openPicker(){
  const root = document.getElementById('picker-root');
  root.innerHTML = `
    <div class="picker-overlay" onclick="if(event.target===this) closePicker()">
      <div class="picker-sheet">
        <div class="picker-title">Pick your sesh</div>
        ${ROUTINE.map((d,i)=> `
          <div class="picker-item" onclick="pickDay(${i})">
            <div>${d.round} — ${d.title}</div>
            <div class="pi-sub">Week ${d.week}</div>
          </div>
        `).join('')}
        <button class="link-btn picker-cancel" onclick="closePicker()">Cancel</button>
      </div>
    </div>
  `;
}
function closePicker(){ document.getElementById('picker-root').innerHTML = ''; }
function pickDay(i){
  state.currentIndex = i;
  state.checked = {};
  saveState();
  closePicker();
  render();
}

(async function init(){
  await loadState();
  render();
})();
</script>
